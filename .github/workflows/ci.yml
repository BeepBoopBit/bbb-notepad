name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Application and documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Check project versions
        run: npm run release:verify
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs verify "$RELEASE_TAG"
      - name: Check documentation
        run: python3 scripts/checks/check-docs.py --root .
      - name: Test documentation checker
        run: python3 tests/tooling/checks/docs_test.py
      - name: Run unit tests
        run: npm test
      - name: Run Rust core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib
      - name: Check frontend build
        run: npm run build
      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
